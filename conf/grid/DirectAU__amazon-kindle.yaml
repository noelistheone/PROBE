training.set: ./dataset/amazon-kindle/train.txt
test.set: ./dataset/amazon-kindle/test.txt
model:
  name: DirectAU
  type: graph
item.ranking.topN: [10,20]
embedding.size: 64
max.epoch: 100
batch.size: 2048
learning.rate: 0.001
reg.lambda: 0.0001
valid.ratio: 0.1
split.seed: 2024
DirectAU:
  gamma: 2
  n_layers: 3
output: ./results/
