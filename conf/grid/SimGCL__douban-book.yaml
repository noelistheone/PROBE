training.set: ./dataset/douban-book/train.txt
test.set: ./dataset/douban-book/test.txt
model:
  name: SimGCL
  type: graph
item.ranking.topN: [10,20]
embedding.size: 64
max.epoch: 100
batch.size: 2048
learning.rate: 0.001
reg.lambda: 0.0001
valid.ratio: 0.1
split.seed: 2024
eval.every: 5
SimGCL:
  n_layer: 2
  lambda: 0.5
  eps: 0.1
  tau: 0.2
output: ./results/
