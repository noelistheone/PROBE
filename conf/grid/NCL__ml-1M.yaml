training.set: ./dataset/ml-1M/train.txt
test.set: ./dataset/ml-1M/test.txt
model:
  name: NCL
  type: graph
item.ranking.topN: [10,20]
embedding.size: 64
max.epoch: 200
batch.size: 2048
learning.rate: 0.001
reg.lambda: 0.0001
valid.ratio: 0.1
split.seed: 2024
eval.every: 5
NCL:
  n_layer: 3
  ssl_reg: 1e-6
  proto_reg: 1e-7
  tau: 0.05
  hyper_layers: 1
  alpha: 1
  num_clusters: 2000
output: ./results/
