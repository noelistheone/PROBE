training.set: ./dataset/yelp2018/train.txt
test.set: ./dataset/yelp2018/test.txt
model:
  name: BUIR
  type: graph
item.ranking.topN: [10,20]
embedding.size: 64
max.epoch: 100
batch.size: 2048
learning.rate: 0.001
reg.lambda: 0.0001
valid.ratio: 0.1
split.seed: 2024
eval.every: 5
BUIR:
  n_layer: 2
  tau: 0.995
  drop_rate: 0.2
output: ./results/
