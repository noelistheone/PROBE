training.set: ./dataset/yelp2018/train.txt
test.set: ./dataset/yelp2018/test.txt
model:
  name: XSimGCLg
  type: graph
item.ranking.topN: [10,20]
embedding.size: 64
max.epoch: 100
batch.size: 2048
learning.rate: 0.001
reg.lambda: 0.0001
valid.ratio: 0.1
split.seed: 2024
eval.every: 5
XSimGCLg:
  n_layer: 2
  l_star: 1
  lambda: 0.2
  eps: 0.2
  tau: 0.15
  geom_w: 1.0
  geom_beta: 0.5
output: ./results/
